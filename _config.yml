# --- Site -------------------------------------------------------------------
title: Zachary Scott-Murphy
author: Zachary Scott-Murphy
email: zachary@scott-murphy.com
description: >-
  Writing on computer vision, machine learning, and the mathematics underneath them.
url: https://zacsmms.github.io
baseurl: ""
github_username: zacsmms

# --- Build ------------------------------------------------------------------
permalink: /writing/:title/
markdown: kramdown
sass:
  style: compressed
  sourcemap: never

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Every post gets layout: post. Every page gets layout: default.
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - vendor
