# The topic map. One file: edit here and both the topic list on /knowledge/ and
# the small orbit beside the bio on the home page follow.
#
# ox / oy    position in the home-page orbit; rings are ordered by how connected
#            a topic is, so the centre holds the hubs
# ly / side  where that topic's name sits in the orbit, de-collided offline
# depth      depth of understanding, 4 deepest .. 1 newest. Graded by an AI model from
#            the transcript, repositories, resumes and writing — not self-assessed, and
#            labelled as such on /knowledge/. Sets the orbit label's size (fs, in viewBox
#            units) and its weight, and the type weight on /knowledge/
#
# state: solid = would defend it today | learning = in progress | target = aspirational

