---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %b %Y' }}</time>
      {%- if page.tags.size > 0 %}
        <span class="sep">/</span>
        {% for tag in page.tags %}<span class="tag-label">{{ tag }}</span>{% endfor %}
      {%- endif %}
    </p>
    <h1>{{ page.title }}</h1>
    {%- if page.description %}<p class="post-standfirst">{{ page.description }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="{{ '/#writing' | relative_url }}">&larr; All writing</a>
  </nav>
</article>
